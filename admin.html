<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Admin · FUNEKES</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0e0e0f" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-crown" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5L3 8z"/></symbol>
    <symbol id="i-ne" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M7 17L17 7M8 7h9v9"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 6v12M6 12h12"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></g></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m6-6l-6 6 6 6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 7h14M10 7V5h4v2m-7 0l1 12h8l1-12"/></symbol>
    <symbol id="i-img" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M20 16l-5-5-8 8"/></g></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></symbol>
  </svg>

  <!-- LOGIN -->
  <main class="login" data-login hidden>
    <form class="login__card" data-login-form novalidate>
      <span class="logo"><svg><use href="#i-crown"/></svg><b>FUNEKES</b></span>
      <h1 class="login__title">Panel de administración</h1>
      <p class="login__sub" data-login-hint>Entra con tu cuenta de administrador.</p>
      <label class="field"><span>Correo</span>
        <input class="input" type="email" name="email" autocomplete="username" required /></label>
      <label class="field"><span>Contraseña</span>
        <input class="input" type="password" name="password" autocomplete="current-password" required /></label>
      <p class="form-error" data-login-error hidden role="alert"></p>
      <button class="btn btn--primary btn--block" type="submit">Entrar</button>
      <a class="login__back" href="./">← Volver al sitio</a>
    </form>
  </main>

  <!-- APP -->
  <div class="app" data-app hidden>
    <header class="top">
      <div class="top__in">
        <a href="./" class="logo" aria-label="Ver sitio"><svg><use href="#i-crown"/></svg><b>FUNEKES</b></a>
        <span class="tag">Admin</span>
        <nav class="tabs" role="tablist" aria-label="Secciones">
          <button role="tab" data-tab="orders" aria-selected="true">Órdenes</button>
          <button role="tab" data-tab="events" aria-selected="false">Eventos y precios</button>
          <button role="tab" data-tab="settings" aria-selected="false">Contacto</button>
        </nav>
        <div class="top__r">
          <span class="top__user" data-user></span>
          <a class="iconbtn" href="./" target="_blank" aria-label="Ver sitio"><svg><use href="#i-ne"/></svg></a>
          <button class="iconbtn" data-logout aria-label="Cerrar sesión"><svg><use href="#i-out"/></svg></button>
        </div>
      </div>
    </header>

    <main class="main">
      <!-- ÓRDENES -->
      <section data-panel="orders">
        <div class="head">
          <div>
            <p class="eyebrow">Ventas</p>
            <h1 class="h1">Órdenes</h1>
          </div>
          <div class="head__r">
            <label class="sr-only" for="ev-select">Evento</label>
            <select id="ev-select" class="input select" data-ev-select></select>
            <button class="iconbtn" data-reload aria-label="Actualizar"><svg><use href="#i-refresh"/></svg></button>
          </div>
        </div>

        <div class="kpis" data-kpis></div>
        <div class="tierbar" data-tierbar></div>

        <div class="toolbar">
          <div class="seg" role="tablist" aria-label="Filtrar por estado" data-filter>
            <button data-f="pendiente" aria-selected="true">Pendientes <i data-c="pendiente"></i></button>
            <button data-f="pagado" aria-selected="false">Pagadas <i data-c="pagado"></i></button>
            <button data-f="cancelado" aria-selected="false">Canceladas <i data-c="cancelado"></i></button>
            <button data-f="all" aria-selected="false">Todas <i data-c="all"></i></button>
          </div>
          <label class="search">
            <svg><use href="#i-search"/></svg>
            <input class="input" type="search" placeholder="Buscar código, nombre o correo" data-search />
          </label>
        </div>

        <div class="table" data-orders role="table" aria-label="Órdenes"></div>
      </section>

      <!-- EVENTOS -->
      <section data-panel="events" hidden>
        <div data-events-list></div>
        <div data-event-editor hidden></div>
      </section>

      <!-- CONTACTO -->
      <section data-panel="settings" hidden>
        <div class="head">
          <div>
            <p class="eyebrow">Ajustes</p>
            <h1 class="h1">Contacto</h1>
          </div>
        </div>
        <form class="card form" data-settings-form novalidate>
          <p class="hint">Al terminar su orden, el comprador abre un WhatsApp a este número con su código, y tú le respondes con los datos de transferencia.</p>
          <div class="grid2">
            <label class="field"><span>WhatsApp (con +56)</span><input class="input" name="whatsapp" inputmode="tel" placeholder="+56912345678" /></label>
            <label class="field"><span>Instagram (sin @)</span><input class="input" name="instagram" /></label>
          </div>
          <div class="form__foot"><button class="btn btn--primary" type="submit">Guardar cambios</button></div>
        </form>
      </section>
    </main>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
